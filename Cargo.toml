[package]
name = "systemsettings"
version = "26.1.0"
edition = "2021"
description = "System Settings for TontooOS"
readme = "README.md"

[[bin]]
name = "systemsettings"
path = "src/main.rs"

[dependencies]
# TontooOS SDK: frameworks via features (on-device: /Library/System/sdk).
sdk = { path = "../../TontooLibs/SDK", features = ["TontooUI", "UIKit", "CoreIcon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
once_cell = "1.19"
gtk = { package = "gtk4", version = "0.9" }
glib = "0.20"
# Fast scaled-down thumbnail loads (full 4K/6K wallpapers stay on disk).
gdk-pixbuf = "0.20"
