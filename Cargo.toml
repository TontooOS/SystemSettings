[package]
name = "systemsettings"
version = "27.0.0"
edition = "2021"
description = "System Settings for TontooOS"
readme = "README.md"

[[bin]]
name = "systemsettings"
path = "src/main.rs"

[dependencies]
# TontooOS SDK: frameworks via features (on-device: /Library/System/sdk).
sdk = { path = "../../TontooLibs/SDK", features = ["TontooUI", "CoreIcon", "CoreImage"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
once_cell = "1.19"
